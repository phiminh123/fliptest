<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Flipbook Demo - Mobile Fixed</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, #f1f1f1 0%, #d9d9d9 65%, #cfcfcf 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      overflow-x: hidden;
    }

    .stage {
      width: min(1180px, 100vw);
      padding: 20px 8px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #book {
      margin: 0 auto;
      filter: drop-shadow(0 20px 25px rgba(0,0,0,.18));
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      background: #f7f3ea;
      overflow: hidden;
    }

    .page-content {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #f7f3ea;
    }

    .page img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .page-content::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,.08),
        transparent 22%,
        transparent 78%,
        rgba(0,0,0,.04)
      );
      mix-blend-mode: multiply;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 16px;
    }

    button {
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.92);
      border-radius: 9px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    button:active {
      transform: translateY(1px);
    }

    #pageInfo {
      min-width: 110px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    .hint {
      margin: 12px 0 0;
      padding: 0 12px;
      text-align: center;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      body {
        justify-content: flex-start;
      }

      .stage {
        padding-top: 10px;
      }

      .toolbar {
        margin-top: 12px;
      }

      .hint {
        max-width: 460px;
      }
    }
  </style>
</head>

<body>
  <main class="stage">
    <div id="book">
      <div class="page" data-density="soft">
        <div class="page-content"><img src="page1.jpg" alt="Trang 1"></div>
      </div>

      <div class="page" data-density="soft">
        <div class="page-content"><img src="page2.jpg" alt="Trang 2"></div>
      </div>

      <div class="page" data-density="soft">
        <div class="page-content"><img src="page3.jpg" alt="Trang 3"></div>
      </div>

      <div class="page" data-density="soft">
        <div class="page-content"><img src="page4.jpg" alt="Trang 4"></div>
      </div>
    </div>

    <div class="toolbar">
      <button id="prevBtn">← Trang trước</button>
      <span id="pageInfo">Trang 1 / 4</span>
      <button id="nextBtn">Trang sau →</button>
    </div>

    <p class="hint" id="hint"></p>
  </main>

  <script>
    const isMobile =
      window.matchMedia("(max-width: 700px)").matches ||
      ("ontouchstart" in window);

    const bookEl = document.getElementById("book");

    const pageFlip = new St.PageFlip(bookEl, {
      width: 450,
      height: 600,

      size: "stretch",
      minWidth: 280,
      maxWidth: 540,
      minHeight: 373,
      maxHeight: 720,

      showCover: false,
      usePortrait: true,
      autoSize: true,

      drawShadow: true,
      maxShadowOpacity: 0.78,
      flippingTime: 950,

      /*
       * Desktop:
       *   StPageFlip tự xử lý kéo góc trang.
       *
       * Mobile:
       *   Tắt touch-native của thư viện và tự xử lý swipe ở dưới.
       *   Mục đích là prev/next luôn chạy cùng kiểu animation.
       */
      useMouseEvents: !isMobile,

      mobileScrollSupport: true,
      clickEventForward: true,

      swipeDistance: 20,
      showPageCorners: true,
      disableFlipByClick: false
    });

    const pages = document.querySelectorAll(".page");
    pageFlip.loadFromHTML(pages);

    const pageInfo = document.getElementById("pageInfo");
    const hint = document.getElementById("hint");

    let currentPage = 0;
    let animating = false;

    function updatePageInfo(index) {
      currentPage = index;
      pageInfo.textContent = `Trang ${index + 1} / ${pages.length}`;
    }

    pageFlip.on("flip", (e) => {
      updatePageInfo(e.data);

      // khóa rất ngắn để tránh double-swipe trên điện thoại
      animating = true;
      window.setTimeout(() => {
        animating = false;
      }, 250);
    });

    /*
     * QUAN TRỌNG:
     * cả lật tới và lật lui đều dùng BOTTOM.
     * Nhờ vậy hình dạng animation thống nhất hơn.
     */
    function nextPage() {
      if (animating) return;
      pageFlip.flipNext("bottom");
    }

    function prevPage() {
      if (animating) return;
      pageFlip.flipPrev("bottom");
    }

    document.getElementById("prevBtn").addEventListener("click", prevPage);
    document.getElementById("nextBtn").addEventListener("click", nextPage);

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") prevPage();
      if (e.key === "ArrowRight") nextPage();
    });

    /*
     * Mobile swipe riêng:
     * - vuốt sang trái  -> trang sau
     * - vuốt sang phải -> trang trước
     * - tap nửa phải   -> trang sau
     * - tap nửa trái   -> trang trước
     */
    if (isMobile) {
      let startX = 0;
      let startY = 0;
      let startTime = 0;

      bookEl.addEventListener("touchstart", (e) => {
        if (!e.touches || e.touches.length !== 1) return;

        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
        startTime = Date.now();
      }, { passive: true });

      bookEl.addEventListener("touchend", (e) => {
        if (!e.changedTouches || e.changedTouches.length !== 1) return;

        const t = e.changedTouches[0];

        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        const elapsed = Date.now() - startTime;

        const absX = Math.abs(dx);
        const absY = Math.abs(dy);

        // Swipe ngang rõ ràng
        if (absX >= 38 && absX > absY * 1.15 && elapsed < 900) {
          if (dx < 0) {
            nextPage();
          } else {
            prevPage();
          }
          return;
        }

        // Tap nhanh: nửa trái / nửa phải
        if (absX < 14 && absY < 14 && elapsed < 350) {
          const rect = bookEl.getBoundingClientRect();
          const localX = t.clientX - rect.left;

          if (localX < rect.width / 2) {
            prevPage();
          } else {
            nextPage();
          }
        }
      }, { passive: true });

    }

    updatePageInfo(0);
  </script>
</body>
</html>
