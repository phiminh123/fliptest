<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <title>PDF Flipbook</title>

  <!-- StPageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #dedede;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .stage {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding:
        max(10px, env(safe-area-inset-top))
        8px
        max(10px, env(safe-area-inset-bottom));
    }

    #loading {
      padding: 14px 18px;
      border-radius: 10px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
      color: #444;
      margin-bottom: 12px;
    }

    .book-shell {
      width: 100%;
      max-width: 1100px;
      height: min(76dvh, 760px);

      display: none;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      contain: layout paint;
    }

    #book {
      margin: 0 auto;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      touch-action: pan-y;
    }

    .page {
      background: white;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .page-inner {
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
    }

    .page canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .toolbar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;

      margin-top: 10px;
    }

    button {
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.94);

      border-radius: 9px;
      padding: 10px 15px;

      font-size: 14px;
      cursor: pointer;
      touch-action: manipulation;
    }

    #pageInfo {
      min-width: 110px;
      text-align: center;
      color: #555;
      font-size: 13px;
    }

    .hint {
      display: none;
      max-width: 620px;
      margin: 8px 0 0;
      padding: 0 12px;

      text-align: center;
      color: #555;
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 700px) {
      .stage {
        justify-content: flex-start;
      }

      .book-shell {
        height: min(70dvh, 620px);
      }
    }
  </style>
</head>

<body>

  <main class="stage">

    <div id="loading">
      Đang tải PDF...
    </div>

    <div class="book-shell" id="bookShell">
      <div id="book"></div>
    </div>

    <div class="toolbar" id="toolbar">
      <button id="prevBtn">← Trang trước</button>
      <span id="pageInfo">Trang 1</span>
      <button id="nextBtn">Trang sau →</button>
    </div>

    <p class="hint" id="hint">
      Flipbook này đọc trực tiếp <strong>book.pdf</strong>.
      Không cần tách PDF thành JPG.
    </p>

  </main>

  <script type="module">

    import * as pdfjsLib
      from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


    const PDF_URL = "book.pdf";

    const loadingEl = document.getElementById("loading");
    const bookShell = document.getElementById("bookShell");
    const bookElement = document.getElementById("book");

    const toolbar = document.getElementById("toolbar");
    const hint = document.getElementById("hint");
    const pageInfo = document.getElementById("pageInfo");

    const isMobile =
      window.matchMedia("(max-width: 700px)").matches;


    async function loadFlipbook() {

      try {

        /*
          1. Đọc PDF
        */
        const loadingTask = pdfjsLib.getDocument(PDF_URL);
        const pdf = await loadingTask.promise;

        // loadingEl.textContent =
        //   `Đang render ${pdf.numPages} trang...`;

        /*
          2. Render từng trang PDF thành canvas
        */
        for (let pageNumber = 1;
             pageNumber <= pdf.numPages;
             pageNumber++) {

          const pdfPage =
            await pdf.getPage(pageNumber);

          /*
            Scale 1.5 đủ nét cho demo.
            PDF lớn có thể giảm xuống 1.2 để tiết kiệm RAM.
          */
          const viewport =
            pdfPage.getViewport({
              scale: isMobile ? 1.25 : 1.5
            });


          const pageDiv =
            document.createElement("div");

          pageDiv.className = "page";

          /*
            soft = dùng hiệu ứng uốn trang
          */
          pageDiv.dataset.density = "soft";


          const inner =
            document.createElement("div");

          inner.className = "page-inner";


          const canvas =
            document.createElement("canvas");

          const context =
            canvas.getContext("2d", {
              alpha: false
            });


          /*
            devicePixelRatio tối đa 2,
            tránh canvas quá lớn trên iPhone Retina.
          */
          const outputScale =
            Math.min(window.devicePixelRatio || 1, 2);


          canvas.width =
            Math.floor(viewport.width * outputScale);

          canvas.height =
            Math.floor(viewport.height * outputScale);


          canvas.style.width =
            viewport.width + "px";

          canvas.style.height =
            viewport.height + "px";


          const transform =
            outputScale !== 1
              ? [outputScale, 0, 0, outputScale, 0, 0]
              : null;


          await pdfPage.render({
            canvasContext: context,
            viewport: viewport,
            transform: transform
          }).promise;


          inner.appendChild(canvas);
          pageDiv.appendChild(inner);
          bookElement.appendChild(pageDiv);
        }


        /*
          3. Sau khi toàn bộ PDF render xong
             mới khởi tạo StPageFlip.
        */
        const pages =
          document.querySelectorAll(".page");


        const pageFlip =
          new St.PageFlip(bookElement, {

            width: 450,
            height: 636,

            size: "stretch",

            minWidth: 120,
            maxWidth: 450,

            minHeight: 170,
            maxHeight: 636,

            /*
              Giữ 2 trang cả desktop/mobile
              như bản bạn đang test trước đó.
            */
            usePortrait: false,

            showCover: false,
            autoSize: false,

            drawShadow: true,
            maxShadowOpacity: 0.82,

            flippingTime: 1000,

            useMouseEvents: true,
            mobileScrollSupport: false,

            swipeDistance: 18,

            showPageCorners: true,
            disableFlipByClick: false,
            clickEventForward: true
          });


        pageFlip.loadFromHTML(pages);


        /*
          4. UI
        */
        pageFlip.on("flip", (event) => {

          pageInfo.textContent =
            `Trang ${event.data + 1} / ${pdf.numPages}`;

        });


        document
          .getElementById("nextBtn")
          .addEventListener("click", () => {

            pageFlip.flipNext("bottom");

          });


        document
          .getElementById("prevBtn")
          .addEventListener("click", () => {

            pageFlip.flipPrev("bottom");

          });


        pageInfo.textContent =
          `Trang 1 / ${pdf.numPages}`;

        loadingEl.style.display = "none";

        bookShell.style.display = "flex";
        toolbar.style.display = "flex";
        hint.style.display = "block";


      } catch (error) {

        console.error(error);

        loadingEl.innerHTML =
          "Không tải được <strong>book.pdf</strong>.<br>" +
          "Hãy kiểm tra file PDF nằm cùng thư mục với index.html.";

      }

    }


    loadFlipbook();

  </script>

</body>
</html>
