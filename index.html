<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

  <title>Flipbook</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #dedede;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .stage {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding:
        max(10px, env(safe-area-inset-top))
        6px
        max(10px, env(safe-area-inset-bottom));

      overflow: hidden;
    }

    /*
      Khung cố định giúp tránh Safari thay đổi layout
      khi thanh địa chỉ iOS co / giãn.
    */
    .book-shell {
      width: 100%;
      max-width: 1080px;

      height: min(76dvh, 720px);

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      contain: layout paint;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    #book {
      margin: 0 auto;

      transform: translateZ(0);
      -webkit-transform: translateZ(0);

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      touch-action: pan-y;
    }

    .page {
      background: #f7f3ea;
      overflow: hidden;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .page-content {
      width: 100%;
      height: 100%;
      position: relative;

      overflow: hidden;
      background: #f7f3ea;
    }

    .page img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /*
      Ánh sáng rất nhẹ ở mép trang.
      Shadow chính vẫn do StPageFlip render.
    */
    .page-content::after {
      content: "";
      position: absolute;
      inset: 0;

      pointer-events: none;

      background: linear-gradient(
        90deg,
        rgba(255,255,255,.05),
        transparent 18%,
        transparent 82%,
        rgba(0,0,0,.035)
      );

      mix-blend-mode: multiply;
    }

    .toolbar {
      flex: 0 0 auto;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 8px;

      margin-top: 10px;
    }

    button {
      appearance: none;
      -webkit-appearance: none;

      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.94);

      border-radius: 9px;
      padding: 10px 15px;

      font-size: 14px;
      cursor: pointer;

      touch-action: manipulation;
    }

    button:active {
      opacity: .72;
    }

    #pageInfo {
      min-width: 105px;
      text-align: center;

      color: #555;
      font-size: 13px;
    }

    .hint {
      flex: 0 0 auto;

      margin: 8px 0 0;
      padding: 0 12px;

      max-width: 620px;

      color: #555;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    /*
      Mobile:
      vẫn giữ 2 trang.
      Vì vậy mỗi trang sẽ nhỏ hơn nhưng forward/backward
      dùng cùng cơ chế spread của StPageFlip.
    */
    @media (max-width: 700px) {
      .stage {
        justify-content: flex-start;
        padding-top: max(8px, env(safe-area-inset-top));
      }

      .book-shell {
        height: min(68dvh, 610px);
      }

      #book {
        filter: none;
      }

      .toolbar {
        margin-top: 8px;
      }

      button {
        padding: 9px 12px;
        font-size: 13px;
      }

      .hint {
        font-size: 11px;
      }
    }

    @media (min-width: 701px) {
      #book {
        filter: drop-shadow(0 16px 24px rgba(0,0,0,.18));
      }
    }
  </style>
</head>

<body>
  <main class="stage">

    <div class="book-shell">
      <div id="book">

        <div class="page" data-density="soft">
          <div class="page-content">
            <img src="page1.jpg" alt="Trang 1">
          </div>
        </div>

        <div class="page" data-density="soft">
          <div class="page-content">
            <img src="page2.jpg" alt="Trang 2">
          </div>
        </div>

        <div class="page" data-density="soft">
          <div class="page-content">
            <img src="page3.jpg" alt="Trang 3">
          </div>
        </div>

        <div class="page" data-density="soft">
          <div class="page-content">
            <img src="page4.jpg" alt="Trang 4">
          </div>
        </div>

      </div>
    </div>

    <div class="toolbar">
      <button id="prevBtn">← Trang trước</button>
      <span id="pageInfo">Trang 1 / 4</span>
      <button id="nextBtn">Trang sau →</button>
    </div>

    <p class="hint">
      Trên iPhone/iPad: chạm gần góc hoặc mép trang rồi kéo chậm.
      Bản này luôn giữ chế độ 2 trang để hiệu ứng lật tới và lật lui đồng nhất hơn.
    </p>

  </main>

  <script>
    const bookElement = document.getElementById("book");
    const pages = document.querySelectorAll(".page");
    const pageInfo = document.getElementById("pageInfo");

    const isMobile = window.matchMedia("(max-width: 700px)").matches;

    /*
      Kích thước page nhỏ hơn trên mobile để 2 trang
      có thể nằm vừa trong chiều rộng màn hình.
    */
    const pageWidth  = isMobile ? 180 : 450;
    const pageHeight = isMobile ? 240 : 600;

    const pageFlip = new St.PageFlip(bookElement, {
      width: pageWidth,
      height: pageHeight,

      size: "stretch",

      /*
        Desktop: mỗi page tối đa 450 x 600.
        Mobile: cho phép thu nhỏ đáng kể để giữ spread 2 trang.
      */
      minWidth: 120,
      maxWidth: isMobile ? 220 : 450,

      minHeight: 160,
      maxHeight: isMobile ? 294 : 600,

      /*
        QUAN TRỌNG:
        false = không chuyển sang chế độ 1-page portrait.
        Đây là thay đổi chính của bản này.
      */
      usePortrait: false,

      showCover: false,

      /*
        Giữ kích thước do wrapper kiểm soát,
        tránh resize liên tục trên Safari.
      */
      autoSize: false,

      drawShadow: true,
      maxShadowOpacity: 0.82,

      flippingTime: 1000,

      /*
        Cho StPageFlip xử lý touch trực tiếp.
        Không viết swipe custom.
      */
      useMouseEvents: true,
      mobileScrollSupport: false,

      swipeDistance: 18,

      showPageCorners: true,
      disableFlipByClick: false,
      clickEventForward: true
    });

    pageFlip.loadFromHTML(pages);

    pageFlip.on("flip", (event) => {
      pageInfo.textContent =
        `Trang ${event.data + 1} / ${pages.length}`;
    });

    /*
      Cả hai nút đều dùng cùng corner.
    */
    document
      .getElementById("nextBtn")
      .addEventListener("click", () => {
        pageFlip.flipNext("bottom");
      });

    document
      .getElementById("prevBtn")
      .addEventListener("click", () => {
        pageFlip.flipPrev("bottom");
      });

    /*
      Chặn pinch zoom của Safari nhưng không chặn drag 1 ngón.
    */
    document.addEventListener("gesturestart", (event) => {
      event.preventDefault();
    });

    /*
      Không preventDefault touchmove trên #book.
      StPageFlip cần touchmove để tính curl.
    */
  </script>
</body>
</html>
