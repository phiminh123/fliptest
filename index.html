<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <title>Flipbook iOS Page Curl</title>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background: #dedede;
      font-family: Arial, Helvetica, sans-serif;
    }

    .stage {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding:
        max(10px, env(safe-area-inset-top))
        8px
        max(10px, env(safe-area-inset-bottom));

      overflow: hidden;
    }

    /*
      Giữ vùng sách ổn định để iOS không giật layout.
      KHÔNG đặt touch-action:none ở #book:
      StPageFlip cần touch event để tạo page curl tương tác.
    */
    .book-shell {
      width: min(96vw, 560px);
      height: min(76dvh, 760px);

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      contain: layout paint;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    #book {
      margin: 0 auto;

      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      /*
        Cho engine nhận gesture ngang,
        nhưng hạn chế trình duyệt giành gesture.
      */
      touch-action: pan-y;
    }

    .page {
      background: #f7f3ea;
      overflow: hidden;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .page-content {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #f7f3ea;
    }

    .page img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;

      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /*
      Một lớp ánh sáng nhẹ để phần uốn giấy nhìn rõ hơn.
      Shadow chính vẫn do StPageFlip tạo.
    */
    .page-content::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background: linear-gradient(
        90deg,
        rgba(255,255,255,.06),
        transparent 18%,
        transparent 82%,
        rgba(0,0,0,.04)
      );

      mix-blend-mode: multiply;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      margin-top: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.94);

      border-radius: 9px;
      padding: 10px 15px;

      font-size: 15px;
      cursor: pointer;

      touch-action: manipulation;
    }

    #pageInfo {
      min-width: 108px;
      text-align: center;
      color: #555;
      font-size: 14px;
    }

    .hint {
      margin: 9px 0 0;
      max-width: 580px;
      padding: 0 12px;

      text-align: center;
      line-height: 1.45;

      font-size: 13px;
      color: #555;
    }

    @media (max-width: 700px) {
      /*
        Trên iOS tránh drop-shadow/filter cho cả book trong lúc transform,
        vì Safari đôi khi repaint toàn viewport gây cảm giác rung.
      */
      #book {
        filter: none;
      }

      .stage {
        justify-content: flex-start;
      }

      .book-shell {
        margin-top: 6px;
      }
    }

    @media (min-width: 701px) {
      #book {
        filter: drop-shadow(0 16px 24px rgba(0,0,0,.18));
      }
    }
  </style>
</head>

<body>
  <main class="stage">

    <div class="book-shell">
      <div id="book">

        <div class="page" data-density="soft">
          <div class="page-content">
            <img src="page1.jpg" alt="Trang 1">
          </div>
        </div>

        <div class="page" data-density="soft">
          <div class="page-content">
            <img src="page2.jpg" alt="Trang 2">
          </div>
        </div>

        <div class="page" data-density="soft">
          <div class="page-content">
            <img src="page3.jpg" alt="Trang 3">
          </div>
        </div>

        <div class="page" data-density="soft">
          <div class="page-content">
            <img src="page4.jpg" alt="Trang 4">
          </div>
        </div>

      </div>
    </div>

    <div class="toolbar">
      <button id="prevBtn">← Trang trước</button>
      <span id="pageInfo">Trang 1 / 4</span>
      <button id="nextBtn">Trang sau →</button>
    </div>

    <p class="hint">
      Trên iPhone/iPad: hãy <strong>chạm gần mép hoặc góc trang rồi kéo</strong>,
      không chỉ vuốt nhanh. Khi kéo chậm, trang sẽ cuộn theo ngón tay.
    </p>

  </main>

  <script>
    const book = document.getElementById("book");
    const pages = document.querySelectorAll(".page");
    const pageInfo = document.getElementById("pageInfo");

    const pageFlip = new St.PageFlip(book, {
      width: 450,
      height: 600,

      size: "stretch",
      minWidth: 260,
      maxWidth: 540,
      minHeight: 347,
      maxHeight: 720,

      /*
        Giữ autoSize để StPageFlip tính đúng vùng touch,
        nhưng shell bên ngoài cố định nên không làm viewport nhảy.
      */
      autoSize: true,

      showCover: false,
      usePortrait: true,

      /*
        SOFT PAGE CURL
      */
      drawShadow: true,
      maxShadowOpacity: 0.85,

      flippingTime: 1000,

      /*
        QUAN TRỌNG:
        Bật input native của PageFlip cả desktop lẫn touch.
        Không tự bắt touchstart/touchmove nữa.
      */
      useMouseEvents: true,

      /*
        false = PageFlip được phép chặn scroll khi đang thao tác trên sách.
        Nhờ vậy gesture ngang không bị Safari lấy mất giữa chừng.
      */
      mobileScrollSupport: false,

      swipeDistance: 24,

      /*
        Khi rê/chạm vùng góc, engine sẽ hiển thị page corner.
      */
      showPageCorners: true,

      /*
        Click/tap vẫn có thể lật.
        Kéo giữ sẽ tạo curl liên tục.
      */
      disableFlipByClick: false,

      clickEventForward: true
    });

    pageFlip.loadFromHTML(pages);

    pageFlip.on("flip", (e) => {
      pageInfo.textContent =
        `Trang ${e.data + 1} / ${pages.length}`;
    });

    /*
      Nút vẫn dùng animation tự động.
      Muốn thấy CURL rõ nhất trên iOS thì kéo trực tiếp trang.
    */
    document.getElementById("nextBtn").addEventListener("click", () => {
      pageFlip.flipNext("bottom");
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      pageFlip.flipPrev("bottom");
    });

    /*
      Chỉ ngăn bounce ngoài vùng sách.
      TUYỆT ĐỐI không preventDefault touchmove trên #book,
      vì engine cần chuỗi touch để tính độ cong.
    */
    document.addEventListener("touchmove", (e) => {
      if (!book.contains(e.target)) {
        e.preventDefault();
      }
    }, { passive: false });

    /*
      Safari đôi khi gửi gesturestart cho pinch zoom.
      Chặn pinch nhưng không chặn drag một ngón.
    */
    document.addEventListener("gesturestart", (e) => {
      e.preventDefault();
    });

  </script>
</body>
</html>
